name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg.git C:\vcpkg

      - name: Bootstrap vcpkg
        run: C:\vcpkg\bootstrap-vcpkg.bat

      - name: Install CURL
        run: C:\vcpkg\vcpkg.exe install curl:x64-windows

      - name: Configure CMake
        run: cmake -B build -S . -A x64 -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canary-windows-build
          path: |
            build/**/*.exe
            build/**/*.dll
